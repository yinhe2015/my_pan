<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理登录 - 云盘</title>
    <link rel="stylesheet" href="/static/inter/inter.css">
    <style>
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #252542;
            --accent-primary: #6366f1;
            --accent-secondary: #818cf8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.6;
        }

        .login-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            padding: 48px 40px 40px;
            width: 400px;
            max-width: 90vw;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.4s ease forwards;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input:focus {
            border-color: var(--accent-primary);
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #fca5a5;
            font-size: 13px;
            text-align: center;
            margin-top: 16px;
            min-height: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">管理</div>
        <p class="subtitle">请输入管理密码</p>
        <div class="input-group">
            <label for="passwordInput">密码</label>
            <input type="password" id="passwordInput" class="input" placeholder="请输入管理密码" autofocus>
        </div>
        <button class="btn btn-primary" id="confirmBtn">确认</button>
        <div class="error-msg" id="errorMsg"></div>
    </div>

    <script>
        const passwordInput = document.getElementById('passwordInput');
        const confirmBtn = document.getElementById('confirmBtn');
        const errorMsg = document.getElementById('errorMsg');

        async function handleLogin() {
            const key = passwordInput.value.trim();
            if (!key) {
                errorMsg.textContent = '请输入管理密码';
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.textContent = '验证中...';
            errorMsg.textContent = '';

            try {
                const response = await fetch('/manage/login/verify_key?key=' + encodeURIComponent(key), {
                    method: 'POST',
                });
                const data = await response.json();

                if (data.success === true) {
                    window.location.href = '/manage?key=' + encodeURIComponent(key);
                } else {
                    errorMsg.textContent = data.message || '密码错误';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = '确认';
            }
        }

        confirmBtn.addEventListener('click', handleLogin);

        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleLogin();
        });
    </script>
</body>
</html>
